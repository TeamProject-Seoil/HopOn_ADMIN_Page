server {
    listen 443 ssl;
    server_name hoponhub.store www.hoponhub.store;

    # 🔐 certbot으로 받은 인증서 (호스트 경로를 docker-compose에서 /etc/nginx/ssl로 마운트했다고 가정)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Vue 정적 파일
    root   /usr/share/nginx/html;
    index  index.html;

    # Vue Router history 모드
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 관리자 백엔드 API 프록시
    location /api/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /actuator/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /admin/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /auth/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /inquiries/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /reservations/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /users/ {
        proxy_pass http://hopon_admin:8081;
    }
}
