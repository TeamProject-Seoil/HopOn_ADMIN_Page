server {
    listen 80;
    server_name _;

    # Vue 정적 파일
    root   /usr/share/nginx/html;
    index  index.html;

    # Vue Router history 모드 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 관리자 백엔드 API 프록시
    # Spring에서 /admin, /auth, /users ... 이런 prefix 쓰는 걸 전제
    location /api/ {
    proxy_pass http://hopon_admin:8081;
    }

    location /actuator/ {
        proxy_pass http://hopon_admin:8081;
    }

    
    location /admin/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /auth/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /inquiries/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /reservations/ {
        proxy_pass http://hopon_admin:8081;
    }

    location /users/ {
        proxy_pass http://hopon_admin:8081;
    }

    
}
